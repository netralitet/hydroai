<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HydroAI 1.0 — Smart TV AI Chat</title>
    <style>
        /* ============================================================
               ГЛОБАЛЬНЫЕ СТИЛИ И ПЕРЕМЕННЫЕ
               ============================================================ */
        :root {
            /* Основная цветовая палитра */
            --color-black: #000000;
            /* Абсолютно чёрный фон чата */
            --color-charcoal: #1d1d1d;
            /* Тёмно-серый древесный уголь для сайдбара */
            --color-gold: #ffcc00;
            /* Жёлто-золотой акцентный цвет */
            --color-gold-glow: rgba(255, 204, 0, 0.6);
            /* Свечение золотого цвета */
            --color-gold-glow-strong: rgba(255, 204, 0, 0.9);
            /* Сильное свечение для фокуса */
            --color-red-pulse: #ff3333;
            /* Красный цвет для пульсации микрофона */
            --color-gray-text: #888888;
            /* Тусклый серый для водяного знака */
            --color-light-text: #ffffff;
            /* Белый текст */
            --color-dark-text: #cccccc;
            /* Светло-серый текст */
            --color-user-msg: #e8f0fe;
            /* Цвет сообщения пользователя */
            --color-ai-msg: #f5f5f5;
            /* Цвет сообщения ИИ */
            --sidebar-width: 30%;
            /* Ширина боковой панели */
            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            /* Плавная анимация */
            --font-family-main: 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            /* Чистый шрифт без засечек */
            --base-font-size: 16px;
            /* Базовый размер шрифта */
            --chat-font-size: 24px;
            /* Крупный шрифт для чата */
            --input-font-size: 20px;
            /* Размер шрифта поля ввода */
        }

        /* Сброс отступов и базовые стили */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--color-black);
            font-family: var(--font-family-main);
            font-size: var(--base-font-size);
            color: var(--color-light-text);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            user-select: none;
            /* Запрещаем выделение текста для TV-интерфейса */
        }

        /* ============================================================
               ОСНОВНОЙ КОНТЕЙНЕР ПРИЛОЖЕНИЯ
               ============================================================ */
        .app-container {
            display: flex;
            width: 100%;
            height: 100vh;
            background: var(--color-black);
            position: relative;
            transition: all var(--transition-smooth);
        }

        /* ============================================================
               ЛЕВАЯ БОКОВАЯ ПАНЕЛЬ (SIDEBAR)
               ============================================================ */
        .sidebar {
            width: var(--sidebar-width);
            min-width: 280px;
            max-width: 420px;
            background: var(--color-charcoal);
            display: flex;
            flex-direction: column;
            padding: 30px 24px;
            position: relative;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
            flex-shrink: 0;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 4px 0 30px rgba(0, 0, 0, 0.5);
        }

        /* Класс для скрытия сайдбара (нажатие "5") */
        .sidebar.hidden {
            width: 0;
            min-width: 0;
            max-width: 0;
            padding: 0;
            overflow: hidden;
            border-right: none;
            opacity: 0;
            pointer-events: none;
        }

        /* Заголовок "HydroAI" вверху сайдбара */
        .sidebar-header {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--color-light-text);
            margin-bottom: 40px;
            text-align: center;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff 30%, #dddddd 70%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Подпись "Модель" */
        .model-label {
            font-size: 14px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--color-gray-text);
            margin-bottom: 16px;
            text-align: center;
        }

        /* Карточка активной модели */
        .model-card {
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 30px 24px;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition-smooth);
            position: relative;
            outline: none;
            flex-shrink: 0;
            /* Базовое свечение для focusable элемента */
            box-shadow: 0 0 0 transparent;
        }

        /* Стиль при фокусе (для D-pad навигации) */
        .model-card.focused,
        .model-card:focus-visible {
            transform: scale(1.05);
            border-color: var(--color-gold);
            box-shadow: 0 0 25px var(--color-gold-glow),
                0 0 60px rgba(255, 204, 0, 0.25),
                inset 0 0 20px rgba(255, 204, 0, 0.05);
        }

        /* Логотип модели внутри карточки */
        .model-logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 20px;
            display: block;
            margin-left: auto;
            margin-right: auto;
            transition: transform var(--transition-smooth);
        }

        .model-card.focused .model-logo {
            transform: scale(1.1);
        }

        /* Название модели */
        .model-name {
            font-size: 26px;
            font-weight: 700;
            color: var(--color-light-text);
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        /* Описание модели */
        .model-description {
            font-size: 14px;
            color: var(--color-gray-text);
            line-height: 1.4;
            font-weight: 400;
        }

        /* Водяной знак внизу сайдбара */
        .sidebar-watermark {
            position: absolute;
            bottom: 24px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 48px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.07);
            letter-spacing: 4px;
            pointer-events: none;
            text-transform: uppercase;
            user-select: none;
        }

        /* Кнопка смены API-ключа в сайдбаре */
        .sidebar-api-btn {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            padding: 8px 18px;
            font-size: 12px;
            color: var(--color-gray-text);
            cursor: pointer;
            transition: all var(--transition-smooth);
            outline: none;
            letter-spacing: 1px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .sidebar-api-btn.focused,
        .sidebar-api-btn:focus-visible {
            border-color: var(--color-gold);
            color: var(--color-gold);
            box-shadow: 0 0 15px var(--color-gold-glow);
            transform: translateX(-50%) scale(1.05);
        }

        /* ============================================================
               ПРАВАЯ ОБЛАСТЬ ЧАТА
               ============================================================ */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--color-black);
            position: relative;
            transition: all var(--transition-smooth);
            min-width: 0;
        }

        /* Область сообщений */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 40px 50px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
            /* Для плавного автоскролла */
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 204, 0, 0.3) transparent;
        }

        /* Стилизация скроллбара для WebKit-браузеров */
        .messages-container::-webkit-scrollbar {
            width: 6px;
        }
        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages-container::-webkit-scrollbar-thumb {
            background: rgba(255, 204, 0, 0.3);
            border-radius: 3px;
        }

        /* Сообщение пользователя */
        .message-user {
            align-self: flex-end;
            max-width: 75%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px 20px 4px 20px;
            padding: 18px 24px;
            font-size: var(--chat-font-size);
            line-height: 1.5;
            color: var(--color-light-text);
            word-wrap: break-word;
            animation: messageIn 0.3s ease-out;
        }

        /* Сообщение ИИ */
        .message-ai {
            align-self: flex-start;
            max-width: 85%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 204, 0, 0.15);
            border-radius: 20px 20px 20px 4px;
            padding: 18px 24px;
            font-size: var(--chat-font-size);
            line-height: 1.5;
            color: var(--color-light-text);
            word-wrap: break-word;
            animation: messageIn 0.3s ease-out;
            min-height: 40px;
        }

        /* Анимация появления сообщения */
        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Мигающий курсор для эффекта печатной машинки */
        .typing-cursor {
            display: inline-block;
            width: 3px;
            height: 1.2em;
            background: var(--color-gold);
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: cursorBlink 0.8s infinite;
        }
        @keyframes cursorBlink {
            0%,
            50% {
                opacity: 1;
            }
            51%,
            100% {
                opacity: 0;
            }
        }

        /* ============================================================
               НИЖНЯЯ ПАНЕЛЬ ВВОДА (КАПСУЛА + КНОПКА МИКРОФОНА)
               ============================================================ */
        .input-area {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 20px 40px 30px;
            transition: all var(--transition-smooth);
        }

        /* Когда сайдбар скрыт, панель ввода центрируется */
        .input-area.centered {
            justify-content: center;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        /* Овальная капсула поля ввода */
        .chat-input {
            flex: 1;
            min-width: 0;
            padding: 18px 32px;
            font-size: var(--input-font-size);
            font-family: var(--font-family-main);
            color: var(--color-light-text);
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid var(--color-gold);
            border-radius: 50px;
            outline: none;
            transition: all var(--transition-smooth);
            caret-color: var(--color-gold);
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.2),
                0 0 40px rgba(255, 204, 0, 0.05);
            letter-spacing: 0.3px;
            /* Базовое свечение */
        }

        /* Фокус на поле ввода */
        .chat-input.focused,
        .chat-input:focus-visible {
            transform: scale(1.02);
            box-shadow: 0 0 30px var(--color-gold-glow),
                0 0 80px rgba(255, 204, 0, 0.2);
            border-color: var(--color-gold-glow-strong);
            background: rgba(255, 255, 255, 0.06);
        }

        /* Круглая кнопка микрофона */
        .mic-button {
            width: 60px;
            height: 60px;
            min-width: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid var(--color-gold);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: var(--color-gold);
            transition: all var(--transition-smooth);
            outline: none;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.2);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }

        /* Фокус на кнопке микрофона */
        .mic-button.focused,
        .mic-button:focus-visible {
            transform: scale(1.08);
            box-shadow: 0 0 35px var(--color-gold-glow-strong),
                0 0 90px rgba(255, 204, 0, 0.3);
            border-color: var(--color-gold-glow-strong);
        }

        /* Пульсация микрофона красным при записи */
        .mic-button.listening {
            animation: micPulse 1.2s ease-in-out infinite;
            border-color: var(--color-red-pulse);
            box-shadow: 0 0 40px rgba(255, 51, 51, 0.6),
                0 0 100px rgba(255, 51, 51, 0.3);
            color: var(--color-red-pulse);
        }
        .mic-button.listening.focused {
            box-shadow: 0 0 50px rgba(255, 51, 51, 0.8),
                0 0 130px rgba(255, 51, 51, 0.4);
        }
        @keyframes micPulse {
            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 20px rgba(255, 51, 51, 0.5),
                    0 0 60px rgba(255, 51, 51, 0.2);
            }
            50% {
                transform: scale(1.15);
                box-shadow: 0 0 45px rgba(255, 51, 51, 0.8),
                    0 0 120px rgba(255, 51, 51, 0.4);
            }
        }

        /* ============================================================
               АНИМАЦИЯ ОЖИДАНИЯ "ИИ ДУМАЕТ" (ТРЕУГОЛЬНИК ИЗ 3 ТОЧЕК)
               ============================================================ */
        .loading-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            pointer-events: none;
            display: none;
            /* Скрыта по умолчанию, показывается через JS */
        }
        .loading-overlay.active {
            display: block;
        }

        /* Контейнер для трёх точек */
        .triangle-loader {
            width: 100px;
            height: 100px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Базовые стили точек */
        .triangle-dot {
            position: absolute;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--color-gold);
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.7),
                0 0 50px rgba(255, 204, 0, 0.3);
            animation-duration: 2.8s;
            animation-timing-function: cubic-bezier(0.45, 0, 0.55, 1);
            animation-iteration-count: infinite;
            will-change: transform;
            /* Оптимизация для GPU */
        }

        /* Точка A — верхняя (центр сверху) */
        .triangle-dot-a {
            top: 5px;
            left: 50%;
            margin-left: -9px;
            animation-name: dotAAnimation;
        }

        /* Точка B — нижняя левая */
        .triangle-dot-b {
            bottom: 5px;
            left: 8px;
            animation-name: dotBAnimation;
        }

        /* Точка C — нижняя правая */
        .triangle-dot-c {
            bottom: 5px;
            right: 8px;
            animation-name: dotCAnimation;
        }

        /* ============================================================
           КЛЮЧЕВЫЕ КАДРЫ ДЛЯ АНИМАЦИИ ТРЕУГОЛЬНИКА
           Цикл: сжатие к центру -> слияние -> разлёт со сменой мест
           ============================================================ */
        @keyframes dotAAnimation {
            /* 0-25%: Сжатие к центру из верхней позиции */
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            25% {
                transform: translate(0, 35px) scale(0.5);
                opacity: 0.8;
            }
            /* 25-35%: Слияние в центральной точке */
            35% {
                transform: translate(0, 35px) scale(0.2);
                opacity: 0.4;
            }
            /* 35-60%: Разлёт на позицию точки B (нижняя левая) */
            60% {
                transform: translate(-41px, 45px) scale(1);
                opacity: 1;
            }
            /* 60-70%: Пауза на новой позиции */
            70% {
                transform: translate(-41px, 45px) scale(1);
                opacity: 1;
            }
            /* 70-95%: Снова сжатие к центру */
            85% {
                transform: translate(-20px, 40px) scale(0.5);
                opacity: 0.8;
            }
            95% {
                transform: translate(0, 35px) scale(0.2);
                opacity: 0.4;
            }
            /* 95-100%: Возврат на исходную позицию */
            100% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
        }

        @keyframes dotBAnimation {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            25% {
                transform: translate(41px, -35px) scale(0.5);
                opacity: 0.8;
            }
            35% {
                transform: translate(41px, -35px) scale(0.2);
                opacity: 0.4;
            }
            60% {
                transform: translate(41px, 10px) scale(1);
                opacity: 1;
            }
            70% {
                transform: translate(41px, 10px) scale(1);
                opacity: 1;
            }
            85% {
                transform: translate(20px, -25px) scale(0.5);
                opacity: 0.8;
            }
            95% {
                transform: translate(41px, -35px) scale(0.2);
                opacity: 0.4;
            }
            100% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
        }

        @keyframes dotCAnimation {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            25% {
                transform: translate(-41px, -35px) scale(0.5);
                opacity: 0.8;
            }
            35% {
                transform: translate(-41px, -35px) scale(0.2);
                opacity: 0.4;
            }
            60% {
                transform: translate(0, -45px) scale(1);
                opacity: 1;
            }
            70% {
                transform: translate(0, -45px) scale(1);
                opacity: 1;
            }
            85% {
                transform: translate(-20px, -25px) scale(0.5);
                opacity: 0.8;
            }
            95% {
                transform: translate(-41px, -35px) scale(0.2);
                opacity: 0.4;
            }
            100% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
        }

        /* ============================================================
               МОДАЛЬНОЕ ОКНО ДЛЯ ВВОДА API-КЛЮЧА
               ============================================================ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: modalFadeIn 0.4s ease-out;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .modal-overlay.hidden {
            display: none;
        }
        @keyframes modalFadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Само модальное окно */
        .modal-card {
            background: var(--color-charcoal);
            border: 2px solid var(--color-gold);
            border-radius: 30px;
            padding: 50px 40px;
            max-width: 550px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 60px rgba(255, 204, 0, 0.25),
                0 0 150px rgba(255, 204, 0, 0.1);
            animation: modalCardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes modalCardIn {
            from {
                transform: scale(0.7);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-title {
            font-size: 36px;
            font-weight: 700;
            color: var(--color-light-text);
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .modal-subtitle {
            font-size: 16px;
            color: var(--color-gray-text);
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .modal-input {
            width: 100%;
            padding: 16px 24px;
            font-size: 18px;
            font-family: var(--font-family-main);
            color: var(--color-light-text);
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            outline: none;
            margin-bottom: 20px;
            transition: all var(--transition-smooth);
            caret-color: var(--color-gold);
            letter-spacing: 0.5px;
        }

        .modal-input:focus,
        .modal-input.focused {
            border-color: var(--color-gold);
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.3);
        }

        .modal-submit-btn {
            padding: 16px 40px;
            font-size: 18px;
            font-weight: 600;
            font-family: var(--font-family-main);
            color: #000000;
            background: var(--color-gold);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all var(--transition-smooth);
            outline: none;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.4);
        }

        .modal-submit-btn:hover,
        .modal-submit-btn.focused,
        .modal-submit-btn:focus-visible {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(255, 204, 0, 0.7);
            background: #ffdd33;
        }

        .modal-error {
            font-size: 14px;
            color: #ff5555;
            margin-top: 10px;
            min-height: 20px;
            transition: opacity 0.3s;
        }

        /* ============================================================
               АДАПТИВНОСТЬ ДЛЯ РАЗНЫХ РАЗРЕШЕНИЙ ТЕЛЕВИЗОРОВ
               ============================================================ */
        @media (min-width: 2560px) {
            /* 4K телевизоры */
            :root {
                --base-font-size: 20px;
                --chat-font-size: 32px;
                --input-font-size: 26px;
            }
            .sidebar {
                padding: 40px 30px;
            }
            .sidebar-header {
                font-size: 42px;
            }
            .model-logo {
                width: 100px;
                height: 100px;
            }

<body>

    <!-- ============================================================
    ОСНОВНОЙ КОНТЕЙНЕР ПРИЛОЖЕНИЯ
    ============================================================ -->
    <div class="app-container" id="appContainer">

        <!-- ЛЕВАЯ БОКОВАЯ ПАНЕЛЬ (SIDEBAR) -->

            >
            <!-- Название модели -->

<!-- ПРАВАЯ ОБЛАСТЬ ЧАТА -->

<!-- ============================================================
МОДАЛЬНОЕ ОКНО ДЛЯ ВВОДА API-КЛЮЧА

<div class="modal-overlay hidden" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">

<!-- ============================================================
JAVASCRIPT — ВСЯ ЛОГИКА ПРИЛОЖЕНИЯ
============================================================ -->
<script>
    (function() {
        'use strict';

        // ============================================================
        // 1. КОНФИГУРАЦИЯ И ДАННЫЕ МОДЕЛЕЙ
        // ============================================================
        const VOIDAI_API_URL = 'https://api.voidai.app/v1/chat/completions';
        const IPIFY_URL = 'https://api.ipify.org?format=json';

        // Массив моделей с полными данными
        const MODELS = [
            {
                id: 'gpt-5.6-luna',
                displayName: 'GPT-5.6-Luna',
                description: 'Рекомендуется для повседневных задач',
                logo: 'chatgpt.png',
                fallbackLogo: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" rx="15" fill="%23333"/><text x="50%" y="50%" fill="%23fff" font-size="30" text-anchor="middle" dy=".35em">GPT</text></svg>'
            }, {
                id: 'gpt-5.4-mini',
                displayName: 'GPT-5.4-Mini',
                description: 'Быстрая и лёгкая модель для простых задач',
                logo: 'chatgpt.png',
                fallbackLogo: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" rx="15" fill="%23333"/><text x="50%" y="50%" fill="%23fff" font-size="30" text-anchor="middle" dy=".35em">GPT</text></svg>'
            }, {
                id: 'gpt-oss-120b',
                displayName: 'GPT-OSS-120B',
                description: 'Мощная открытая модель для сложных задач',
                logo: 'chatgpt.png',
                fallbackLogo: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" rx="15" fill="%23333"/><text x="50%" y="50%" fill="%23fff" font-size="30" text-anchor="middle" dy=".35em">GPT</text></svg>'
            }, {
                id: 'gemma-4-31b-it',
                displayName: 'Gemma-4-31B-IT',
                description: 'Сбалансированная модель от Google',
                logo: 'gemma.png',
                fallbackLogo: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" rx="15" fill="%23333"/><text x="50%" y="50%" fill="%23fff" font-size="30" text-anchor="middle" dy=".35em">GEM</text></svg>'
            }, {
                id: 'gemini-3.5-flash-lite',
                displayName: 'Gemini-3.5-Flash-Lite',
                description: 'Лёгкая и сверхбыстрая модель',
                logo: 'chatgpt.png',
                fallbackLogo: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" rx="15" fill="%23333"/><text x="50%" y="50%" fill="%23fff" font-size="30" text-anchor="middle" dy=".35em">GEM</text></svg>'
            }, {
                id: 'qwen3.8-2.4t-a95b',
                displayName: 'Qwen3.8-2.4T-A95B',
                description: 'Компактная мультимодальная модель',
                logo: 'qwen.png',
                fallbackLogo: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" rx="15" fill="%23333"/><text x="50%" y="50%" fill="%23fff" font-size="30" text-anchor="middle" dy=".35em">QWEN</text></svg>'
            }
        ];

        // Текущий индекс активной модели
        let currentModelIndex = 0;

        // ============================================================
        // 2. DOM-ЭЛЕМЕНТЫ
        // ============================================================
        const sidebar = document.getElementById('sidebar');
        const modelCard = document.getElementById('modelCard');
        const modelLogo = document.getElementById('modelLogo');
        const modelName = document.getElementById('modelName');
        const modelDescription = document.getElementById('modelDescription');
        const apiKeyBtn = document.getElementById('apiKeyBtn');
        const messagesContainer = document.getElementById('messagesContainer');
        const inputArea = document.getElementById('inputArea');
        const chatInput = document.getElementById('chatInput');
        const micButton = document.getElementById('micButton');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalApiInput = document.getElementById('modalApiInput');
        const modalSubmitBtn = document.getElementById('modalSubmitBtn');
        const modalError = document.getElementById('modalError');

        // ============================================================
        // 3. УПРАВЛЕНИЕ ФОКУСОМ ДЛЯ D-PAD НАВИГАЦИИ
        // ============================================================
        let currentFocusIndex = 0;
        let focusableElements = [];
        let sidebarVisible = true;
        let modalActive = false;

        /**
         * Обновляет список фокусируемых элементов в зависимости от
         * текущего состояния интерфейса (видимость сайдбара, модальное окно)
         */
        function updateFocusableElements() {
            if (modalActive) {
                // Если модальное окно открыто, фокусируемы только его элементы
                focusableElements = [modalApiInput, modalSubmitBtn].filter(el => el && el.offsetParent !==
                    null);
            } else {
                // В обычном режиме: модель (если сайдбар виден), поле ввода, кнопка микрофона, кнопка API
                const elements = [];
                if (sidebarVisible) {
                    elements.push(modelCard);
                    elements.push(apiKeyBtn);
                }
                elements.push(chatInput);
                elements.push(micButton);
                focusableElements = elements.filter(el => el && el.offsetParent !== null);
            }

            // Убедимся, что текущий индекс не выходит за границы
            if (currentFocusIndex >= focusableElements.length) {
                currentFocusIndex = Math.max(0, focusableElements.length - 1);
            }
            if (currentFocusIndex < 0) currentFocusIndex = 0;
        }

        /**
         * Применяет визуальный фокус к элементу по индексу
         */
        function applyFocus(index) {
            // Снимаем фокус со всех элементов
            focusableElements.forEach(el => {
                el.classList.remove('focused');
                el.blur();
            });

            if (focusableElements.length === 0) return;

            // Применяем фокус к текущему элементу
            const target = focusableElements[index];
            if (target) {
                target.classList.add('focused');
                target.focus({ preventScroll: true });
                currentFocusIndex = index;
                // Плавная прокрутка к элементу, если он вне видимости
                target.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        }

        /**
         * Перемещает фокус на следующий элемент (циклически)
         */
        function focusNext() {
            if (focusableElements.length === 0) return;
            const nextIndex = (currentFocusIndex + 1) % focusableElements.length;
            applyFocus(nextIndex);
        }

        /**
         * Перемещает фокус на предыдущий элемент (циклически)
         */
        function focusPrev() {
            if (focusableElements.length === 0) return;
            const prevIndex = (currentFocusIndex - 1 + focusableElements.length) % focusableElements
                .length;
            applyFocus(prevIndex);
        }

        // ============================================================
        // 4. ЛОГИКА УПРАВЛЕНИЯ САЙДБАРОМ (КЛАВИША "5")
        // ============================================================
        function toggleSidebar() {
            sidebarVisible = !sidebarVisible;
            if (sidebarVisible) {
                sidebar.classList.remove('hidden');
                inputArea.classList.remove('centered');
                apiKeyBtn.setAttribute('tabindex', '-1');
                modelCard.setAttribute('tabindex', '0');
            } else {
                sidebar.classList.add('hidden');
                inputArea.classList.add('centered');
                apiKeyBtn.setAttribute('tabindex', '-1');
                modelCard.setAttribute('tabindex', '-1');
            }
            // Обновляем список фокусируемых элементов и переустанавливаем фокус
            updateFocusableElements();
            applyFocus(0);
        }

        // ============================================================
        // 5. ЛОГИКА ПЕРЕКЛЮЧЕНИЯ МОДЕЛЕЙ
        // ============================================================
        function cycleModel() {
            currentModelIndex = (currentModelIndex + 1) % MODELS.length;
            const model = MODELS[currentModelIndex];
            modelName.textContent = model.displayName;
            modelDescription.textContent = model.description;
            modelLogo.src = model.logo;
            modelLogo.alt = 'Логотип ' + model.displayName;
            modelLogo.onerror = function() {
                this.src = model.fallbackLogo;
                this.onerror = null;
            };
        }

        function getCurrentModelId() {
            return MODELS[currentModelIndex].id;
        }

        // ============================================================
        // 6. АВТОРИЗАЦИЯ И УПРАВЛЕНИЕ API-КЛЮЧОМ ПО IP-АДРЕСУ
        // ============================================================
        let userIP = null;
        let apiKey = null;

        /**
         * Получает текущий публичный IP-адрес пользователя
         * Используется бесплатный сервис ipify.org
         */
        async function fetchUserIP() {
            try {
                const response = await fetch(IPIFY_URL, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' },
                    timeout: 5000 // Не во всех браузерах поддерживается, но оставим
                });
                if (!response.ok) throw new Error('Ошибка получения IP');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                console.warn('Не удалось получить IP-адрес:', error);
                // Запасной вариант: используем "unknown" если IP не получен
                return 'unknown_ip';
            }
        }

        /**
         * Формирует ключ для localStorage на основе IP-адреса
         */
        function getStorageKey(ip) {
            return 'hydro_key_' + (ip || 'unknown_ip');
        }

        /**
         * Загружает API-ключ из localStorage по текущему IP
         */
        function loadApiKeyForIP(ip) {
            const key = getStorageKey(ip);
            const savedKey = localStorage.getItem(key);
            return savedKey || null;
        }

        /**
         * Сохраняет API-ключ в localStorage с привязкой к текущему IP
         */
        function saveApiKeyForIP(ip, key) {
            const storageKey = getStorageKey(ip);
            localStorage.setItem(storageKey, key);
            // Также сохраняем IP для быстрого доступа
            localStorage.setItem('hydro_last_ip', ip);
        }

        /**
         * Инициализирует авторизацию: проверяет IP, загружает ключ
         */
        async function initAuth() {
            userIP = await fetchUserIP();
            apiKey = loadApiKeyForIP(userIP);

            if (apiKey) {
                // Ключ найден — приложение готово к работе
                console.log('API-ключ загружен для IP:', userIP);
                return true;
            } else {
                // Ключ не найден — показываем модальное окно
                console.log('API-ключ не найден для IP:', userIP, '— показать модальное окно');
                showModal();
                return false;
            }
        }

        /**
         * Показывает модальное окно для ввода API-ключа
         */
        function showModal() {
            modalActive = true;
            modalOverlay.classList.remove('hidden');
            modalApiInput.value = '';
            modalError.textContent = '';
            updateFocusableElements();
            applyFocus(0);
            // Фокусируемся на поле ввода
            setTimeout(() => {
                modalApiInput.focus();
                modalApiInput.classList.add('focused');
            }, 100);
        }

        /**
         * Скрывает модальное окно
         */
        function hideModal() {
            modalActive = false;
            modalOverlay.classList.add('hidden');
            updateFocusableElements();
            applyFocus(0);
        }

        /**
         * Обрабатывает отправку API-ключа из модального окна
         */
        function handleApiKeySubmit() {
            const enteredKey = modalApiInput.value.trim();
            if (!enteredKey || enteredKey.length < 5) {
                modalError.textContent = 'Введите корректный API-ключ (минимум 5 символов)';
                return;
            }
            if (!enteredKey.startsWith('sk-') && !enteredKey.startsWith('ds-') && !enteredKey.startsWith(
                    'voidai-')) {
                // Не критично, но предупредим
                console.warn('Ключ может быть некорректным, но продолжим');
            }

            apiKey = enteredKey;
            saveApiKeyForIP(userIP, apiKey);
            modalError.textContent = '';
            hideModal();
            console.log('API-ключ сохранён для IP:', userIP);
        }

        // ============================================================
        // 7. ОТПРАВКА СООБЩЕНИЙ И ВЗАИМОДЕЙСТВИЕ С API
        // ============================================================
        /**
         * Добавляет сообщение пользователя в чат
         */
        function addUserMessage(text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message-user';
            msgDiv.textContent = text;
            messagesContainer.appendChild(msgDiv);
            scrollToBottom();
        }

        /**
         * Добавляет сообщение ИИ с эффектом печатной машинки
         */
        function addAIMessageTyped(text, callback) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message-ai';
            messagesContainer.appendChild(msgDiv);

            // Создаём курсор
            const cursor = document.createElement('span');
            cursor.className = 'typing-cursor';
            msgDiv.appendChild(cursor);

            let charIndex = 0;
            const typingSpeed = 18; // мс на символ — плавная скорость

            // Удаляем курсор перед началом
            cursor.remove();

            // Текстовый контейнер
            const textSpan = document.createElement('span');
            msgDiv.appendChild(textSpan);

            function typeNextChar() {
                if (charIndex < text.length) {
                    textSpan.textContent += text.charAt(charIndex);
                    charIndex++;
                    scrollToBottom();
                    setTimeout(typeNextChar, typingSpeed);
                } else {
                    // Завершение — убираем курсор (если он был)
                    msgDiv.querySelectorAll('.typing-cursor').forEach(el => el.remove());
                    if (callback) callback();
                }
            }

            // Добавляем курсор для мигания
            const blinkCursor = document.createElement('span');
            blinkCursor.className = 'typing-cursor';
            msgDiv.appendChild(blinkCursor);

            typeNextChar();

            // Сохраняем ссылку на курсор, чтобы убрать после завершения
            const checkInterval = setInterval(() => {
                if (charIndex >= text.length) {
                    clearInterval(checkInterval);
                    blinkCursor.remove();
                }
            }, 100);
        }

        /**
         * Показывает анимацию ожидания (треугольник из точек)
         */
        function showLoading() {
            loadingOverlay.classList.add('active');
        }

        /**
         * Скрывает анимацию ожидания
         */
        function hideLoading() {
            loadingOverlay.classList.remove('active');
        }

        /**
         * Автоматическая прокрутка к последнему сообщению
         */
        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        /**
         * Отправляет запрос к VoidAI API и обрабатывает ответ
         */
        async function sendToAI(userMessage) {
            if (!apiKey) {
                console.error('API-ключ не установлен');
                showModal();
                return;
            }

            const modelId = getCurrentModelId();
            showLoading();

            try {
                const response = await fetch(VOIDAI_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + apiKey
                    },
                    body: JSON.stringify({
                        model: modelId,
                        messages: [
                            { role: 'user', content: userMessage }
                        ],
                        max_tokens: 2000,
                        temperature: 0.7,
                        stream: false
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    const errorMsg = errorData.error?.message || ('HTTP ошибка: ' + response.status);
                    throw new Error(errorMsg);
                }

                const data = await response.json();
                const aiResponse = data.choices?.[0]?.message?.content || 'Пустой ответ от модели';

                hideLoading();
                addAIMessageTyped(aiResponse);

            } catch (error) {
                hideLoading();
                console.error('Ошибка API:', error);
                const errorMsg = '⚠️ Ошибка: ' + (error.message || 'Не удалось получить ответ');
                const errDiv = document.createElement('div');
                errDiv.className = 'message-ai';
                errDiv.textContent = errorMsg;
                errDiv.style.color = '#ff5555';
                errDiv.style.borderColor = 'rgba(255,85,85,0.4)';
                messagesContainer.appendChild(errDiv);
                scrollToBottom();

                // Если ошибка авторизации — показываем модальное окно
                if (error.message.includes('401') || error.message.includes('auth') ||
                    error.message.toLowerCase().includes('unauthorized')) {
                    showModal();
                }
            }
        }

        /**
         * Отправляет сообщение пользователя (из поля ввода)
         */
        function sendUserMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            addUserMessage(text);
            chatInput.value = '';
            sendToAI(text);
        }

        // ============================================================
        // 8. ГОЛОСОВОЙ ВВОД (WEB SPEECH API)
        // ============================================================
        let recognition = null;
        let isListening = false;

        /**
         * Инициализирует распознавание речи (русский язык)
         */
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                console.warn('Web Speech API не поддерживается в этом браузере');
                return null;
            }

            const rec = new SpeechRecognition();
            rec.lang = 'ru-RU';
            rec.interimResults = false;
            rec.maxAlternatives = 1;
            rec.continuous = false;

            rec.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                if (transcript && transcript.trim()) {
                    chatInput.value = transcript;
                    // Автоматически отправляем распознанный текст
                    sendUserMessage();
                }
            };

            rec.onerror = function(event) {
                console.error('Ошибка распознавания речи:', event.error);
                stopListening();
                // Показываем ошибку в чате
                const errDiv = document.createElement('div');
                errDiv.className = 'message-ai';
                errDiv.textContent = '⚠️ Ошибка распознавания речи: ' + event.error;
                errDiv.style.color = '#ff5555';
                messagesContainer.appendChild(errDiv);
                scrollToBottom();
            };

            rec.onend = function() {
                stopListening();
            };

            return rec;
        }

        /**
         * Запускает прослушивание речи
         */
        function startListening() {
            if (isListening) return;
            if (!recognition) {
                recognition = initSpeechRecognition();
                if (!recognition) return;
            }

            isListening = true;
            micButton.classList.add('listening');
            try {
                recognition.start();
            } catch (e) {
                console.warn('Повторный запуск распознавания:', e);
            }
        }

        /**
         * Останавливает прослушивание речи
         */
        function stopListening() {
            isListening = false;
            micButton.classList.remove('listening');
            if (recognition) {
                try {
                    recognition.stop();
                } catch (e) {
                    // Игнорируем ошибки остановки
                }
            }
        }

        /**
         * Переключает голосовой ввод
         */
        function toggleListening() {
            if (isListening) {
                stopListening();
            } else {
                startListening();
            }
        }

        // ============================================================
        // 9. ОБРАБОТКА СОБЫТИЙ КЛАВИАТУРЫ (D-PAD И КЛАВИШИ)
        // ============================================================
        document.addEventListener('keydown', function(event) {
            const key = event.key;
            const keyCode = event.keyCode || event.which;

            // Клавиша "5" — переключение сайдбара (всегда активно)
            if (key === '5' || keyCode === 53) {
                // Если модальное окно открыто, не переключаем сайдбар
                if (!modalActive) {
                    event.preventDefault();
                    toggleSidebar();
                    return;
                }
            }

            // В модальном окне — специальная обработка
            if (modalActive) {
                switch (key) {
                    case 'ArrowUp':
                    case 'ArrowLeft':
                        event.preventDefault();
                        focusPrev();
                        break;
                    case 'ArrowDown':
                    case 'ArrowRight':
                        event.preventDefault();
                        focusNext();
                        break;
                    case 'Enter':
                        event.preventDefault();
                        // Активируем текущий фокусируемый элемент
                        if (currentFocusIndex === 0) {
                            // Фокус на поле ввода — переходим к кнопке
                            focusNext();
                        } else if (currentFocusIndex === 1) {
                            // Фокус на кнопке — отправляем ключ
                            handleApiKeySubmit();
                        }
                        break;
                    case 'Escape':
                        event.preventDefault();
                        hideModal();
                        break;
                }
                return;
            }

            // Обычный режим — D-pad навигация
            switch (key) {
                case 'ArrowUp':
                case 'ArrowLeft':
                    event.preventDefault();
                    focusPrev();
                    break;
                case 'ArrowDown':
                case 'ArrowRight':
                    event.preventDefault();
                    focusNext();
                    break;
                case 'Enter':
                    event.preventDefault();
                    handleEnterOnFocusedElement();
                    break;
                case 'Escape':
                    // Escape снимает фокус с текущего элемента
                    event.preventDefault();
                    focusableElements.forEach(el => el.classList.remove('focused'));
                    break;
            }
        });

        /**
         * Обрабатывает нажатие Enter на текущем фокусируемом элементе
         */
        function handleEnterOnFocusedElement() {
            if (focusableElements.length === 0) return;
            const focusedEl = focusableElements[currentFocusIndex];

            if (focusedEl === modelCard) {
                // Переключение модели
                cycleModel();
            } else if (focusedEl === chatInput) {
                // Отправка сообщения
                sendUserMessage();
            } else if (focusedEl === micButton) {
                // Голосовой ввод
                toggleListening();
            } else if (focusedEl === apiKeyBtn) {
                // Открытие модального окна для смены ключа
                showModal();
            } else if (focusedEl === modalApiInput) {
                // В модальном окне — переходим к кнопке
                focusNext();
            } else if (focusedEl === modalSubmitBtn) {
                // Отправка API-ключа
                handleApiKeySubmit();
            }
        }

        // ============================================================
        // 10. КЛИКИ МЫШЬЮ (ДЛЯ УДОБСТВА ТЕСТИРОВАНИЯ НА ПК)
        // ============================================================
        modelCard.addEventListener('click', function() {
            cycleModel();
        });

        apiKeyBtn.addEventListener('click', function() {
            showModal();
        });

        micButton.addEventListener('click', function() {
            toggleListening();
        });

        chatInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendUserMessage();
            }
        });

        modalSubmitBtn.addEventListener('click', function() {
            handleApiKeySubmit();
        });

        modalApiInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleApiKeySubmit();
            }
        });

        // Закрытие модального окна по клику на фон
        modalOverlay.addEventListener('click', function(e) {
            if (e.target === modalOverlay) {
                hideModal();
            }
        });

        // ============================================================
        // 11. ИНИЦИАЛИЗАЦИЯ ПРИЛОЖЕНИЯ
        // ============================================================
        async function initApp() {
            console.log('HydroAI 1.0 — инициализация...');

            // Устанавливаем первую модель
            const firstModel = MODELS[0];
            modelName.textContent = firstModel.displayName;
            modelDescription.textContent = firstModel.description;
            modelLogo.src = firstModel.logo;
            modelLogo.alt = 'Логотип ' + firstModel.displayName;
            modelLogo.onerror = function() {
                this.src = firstModel.fallbackLogo;
                this.onerror = null;
            };

            // Инициализируем распознавание речи
            recognition = initSpeechRecognition();

            // Проверяем авторизацию (IP + API-ключ)
            const isAuthorized = await initAuth();

            if (isAuthorized) {
                console.log('HydroAI готов к работе.');
                // Добавляем приветственное сообщение
                const welcomeMsg = document.createElement('div');
                welcomeMsg.className = 'message-ai';
                welcomeMsg.textContent = '👋 Добро пожаловать в HydroAI! Выберите модель в боковой панели и задайте вопрос.';
                messagesContainer.appendChild(welcomeMsg);
                scrollToBottom();
            }

            // Обновляем фокусируемые элементы и устанавливаем фокус
            updateFocusableElements();
            applyFocus(0);
        }

        // Запускаем приложение после полной загрузки DOM
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }

        // ============================================================
        // 12. ОБРАБОТКА ИЗМЕНЕНИЯ РАЗМЕРА ОКНА
        // ============================================================
        window.addEventListener('resize', function() {
            updateFocusableElements();
        });

        // ============================================================
        // 13. ОБРАБОТКА ВИДИМОСТИ (ПРИ СВОРАЧИВАНИИ/РАЗВОРАЧИВАНИИ ВКЛАДКИ)
        // ============================================================
        document.addEventListener('visibilitychange', function() {
            if (document.hidden && isListening) {
                stopListening();
            }
        });

        console.log('HydroAI 1.0 загружен. Нажмите "5" для переключения сайдбара.');
    })();
</script>
</body>
